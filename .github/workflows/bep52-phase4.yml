name: BEP52 phase 4 CI
# upstream/m4 restored from aria2/aria2@9e72735 for reproducible autoreconf

on:
  pull_request:
    branches: [claude/upbeat-cannon-7ovk29]
  workflow_dispatch:

concurrency:
  group: bep52-phase4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint gettext libtool pkg-config \
            libcppunit-dev libssl-dev libxml2-dev libsqlite3-dev libc-ares-dev \
            libssh2-1-dev zlib1g-dev libgcrypt20-dev libgmp-dev
      - name: Bootstrap
        run: autoreconf -i
      - name: Configure
        run: |
          # Fully static build: no loose .so next to aria2c, everything
          # (libaria2 itself, OpenSSL, libxml2, sqlite3, c-ares, libssh2,
          # gcrypt, gmp, ...) linked directly into the binary. Same
          # rationale as the Windows job. This also affects the `make
          # check` test binary built below, which needs cppunit available
          # as a static .a too (libcppunit-dev ships one on Ubuntu).
          PKG_CONFIG="pkg-config --static" LDFLAGS="-static" \
            ./configure --disable-shared --enable-static
      - name: Build and test
        run: make -j2 check
      - name: Verify fully static (no loose .so files)
        run: |
          # The whole point of the static build above is a single
          # standalone binary with nothing next to it. Verify that here
          # instead of silently bundling shared libs to paper over a link
          # that went dynamic: if ldd reports this as a dynamic
          # executable with any non-base-system dependency, fail the
          # build loudly rather than shipping a broken/partial artifact.
          mkdir -p dist
          cp src/aria2c dist/
          raw="$(ldd dist/aria2c 2>&1 || true)"
          echo "$raw"
          if ! echo "$raw" | grep -qi "not a dynamic executable"; then
            extra=$(echo "$raw" | awk '{print $3}' | grep -v '^$' | \
              grep -vE '/(libc|libm|libpthread|libdl|librt|ld-linux-x86-64)\.so' | sort -u || true)
            if [ -n "$extra" ]; then
              echo "ERROR: aria2c is not fully static - found external shared library dependencies:"
              echo "$extra"
              exit 1
            fi
          fi
          chmod +x dist/aria2c
          ls -la dist/
          echo "--- smoke test: dist/aria2c --version ---"
          (cd dist && ./aria2c --version)
      - uses: actions/upload-artifact@v4
        with:
          name: aria2-ultra-bep52-linux-x64
          path: upstream/dist
          if-no-files-found: error
          retention-days: 14

  macos-x64:
    runs-on: macos-13
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool pkg-config gettext \
            openssl@3 libxml2 sqlite c-ares libssh2 gmp libgcrypt
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - name: Force static linking of Homebrew libs
        run: |
          # macOS/ld64 has no real -static mode (Apple only supports
          # dynamic linking against the system's own libSystem/frameworks
          # - that part is unavoidable and expected on this platform, see
          # the "Verify" step below). For our own third-party deps
          # (OpenSSL, libxml2, sqlite3, c-ares, libssh2, gmp, gcrypt) we
          # still want the .a archives Homebrew ships alongside each
          # .dylib, but a plain -lfoo always prefers the .dylib when both
          # exist. Hide the .dylib symlinks so configure/make have no
          # choice but to link the static archive instead.
          for formula in openssl@3 libxml2 sqlite c-ares libssh2 gmp libgcrypt; do
            prefix="$(brew --prefix "$formula")"
            find "$prefix/lib" -maxdepth 1 -name '*.dylib' -exec mv {} {}.disabled \;
          done
      - name: Bootstrap
        run: autoreconf -i
      - name: Configure
        run: |
          PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix libssh2)/lib/pkgconfig" \
          PKG_CONFIG="pkg-config --static" \
            ./configure --disable-websocket
      - name: Build
        run: make -j3
      - name: Verify no Homebrew/bundled dependency remains
        run: |
          # aria2c still dynamically links against Apple's own system
          # libraries (libSystem, CoreFoundation, ...) - that's normal
          # and required on macOS, every binary does it, it's not
          # something an app can or should embed. What must NOT be
          # present after the static-linking step above is any
          # Homebrew-path or otherwise bundled dylib: that's the
          # "no loose file next to the binary" property this platform
          # can actually deliver on.
          test -s src/aria2c
          file src/aria2c
          mkdir -p dist
          cp src/aria2c dist/aria2c
          chmod +x dist/aria2c
          raw="$(otool -L dist/aria2c)"
          echo "$raw"
          extra=$(echo "$raw" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/)' || true)
          if [ -n "$extra" ]; then
            echo "ERROR: aria2c still depends on non-system dylibs:"
            echo "$extra"
            exit 1
          fi
          ls -la dist/
          echo "--- smoke test: dist/aria2c --version ---"
          (cd dist && ./aria2c --version)
      - uses: actions/upload-artifact@v4
        with:
          name: aria2-ultra-bep52-macos-x64
          path: upstream/dist
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    runs-on: windows-2022
    steps:
      # windows-2022 runners default to core.autocrlf=true, which rewrites
      # LF to CRLF on checkout. configure.ac (and other autotools sources)
      # use backslash line continuations that break under CRLF: an M4
      # macro argument list split across lines ends up with stray leading
      # whitespace on every continuation line once checked out as CRLF,
      # which is why AC_CHECK_HEADERS([windows.h \\\n  winsock2.h \\\n ...])
      # silently reports "no" for winsock2.h/ws2tcpip.h/etc even though
      # they exist - the macro-expanded header name has extra whitespace
      # in it. This must run before checkout so it applies to this clone.
      - name: Disable CRLF conversion for autotools sources
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make
            gettext-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-c-ares
            mingw-w64-x86_64-libssh2
            mingw-w64-x86_64-zlib
      - name: Bootstrap and configure
        shell: msys2 {0}
        working-directory: upstream
        run: |
          autoreconf -i
          # Fully static build: no loose DLLs next to aria2c.exe, everything
          # (libaria2 itself, gmp, libxml2, sqlite3, c-ares, libssh2, zlib,
          # gcc/stdc++/winpthread runtime) linked directly into the .exe.
          # --disable-shared/--enable-static make libtool build libaria2 as
          # a static .a instead of a DLL; -static in LDFLAGS (plus the
          # explicit -static-libgcc/-static-libstdc++/-static compiler
          # driver flags) tells the linker to prefer the .a archives MSYS2
          # ships alongside each package's .dll.a import library, instead
          # of dynamically linking against the shared one; PKG_CONFIG
          # --static makes pkg-config report each library's transitive
          # static dependencies too (e.g. libxml2's own dependency on
          # zlib/iconv), which plain dynamic .pc lookups omit.
          PKG_CONFIG="pkg-config --static" \
          LDFLAGS="-static -static-libgcc -static-libstdc++" \
            ./configure --host=x86_64-w64-mingw32 --with-wintls --without-openssl \
              --disable-websocket --disable-shared --enable-static
      - name: Build
        shell: msys2 {0}
        working-directory: upstream
        run: make -j2
      - name: Install to staging prefix
        shell: msys2 {0}
        working-directory: upstream
        run: |
          # src/aria2c.exe is NOT the real binary: it's a small (tens of
          # KB) libtool launcher stub that only works inside the build
          # tree (alongside src/.libs/), which is why `ldd` on it shows
          # nothing but base Windows DLLs (no libaria2, no third-party
          # libs at all) and it fails to run once copied out on its own.
          # `make install` makes libtool relink the real, final binary
          # into place - the standard, well-tested way an autotools
          # project like this one is meant to produce a distributable
          # binary - so use that instead of guessing at .libs/ paths.
          make install DESTDIR="$PWD/instroot"
          find instroot -name 'aria2c.exe'
      - name: Verify binary
        shell: msys2 {0}
        working-directory: upstream
        run: |
          bin=$(find instroot -name 'aria2c.exe' | head -1)
          echo "BIN=$bin" >> "$GITHUB_ENV"
          test -s "$bin"
          file "$bin"
      - name: Verify fully static (no loose DLLs)
        shell: msys2 {0}
        working-directory: upstream
        run: |
          # The whole point of the static build above is a single
          # standalone .exe with nothing next to it. Verify that here
          # instead of silently bundling DLLs to paper over a link that
          # went dynamic: if ldd finds anything beyond base Windows
          # system DLLs, fail the build loudly so it gets fixed rather
          # than shipping a broken artifact.
          mkdir -p dist
          cp "$BIN" dist/aria2c.exe
          raw="$(ldd dist/aria2c.exe || true)"
          echo "$raw"
          extra=$(echo "$raw" | awk '{print $3}' | grep -v '^$' | grep -viE '^/c/windows/' | sort -u || true)
          if [ -n "$extra" ]; then
            echo "ERROR: aria2c.exe is not fully static - found external DLL dependencies:"
            echo "$extra"
            exit 1
          fi
          ls -la dist/
          echo "--- smoke test: dist/aria2c.exe --version ---"
          (cd dist && ./aria2c.exe --version)
      - uses: actions/upload-artifact@v4
        with:
          name: aria2-ultra-bep52-windows-x64
          path: upstream/dist
          if-no-files-found: error
          retention-days: 14
