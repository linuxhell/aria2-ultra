name: BEP52 phase 4 CI
# upstream/m4 restored from aria2/aria2@9e72735 for reproducible autoreconf

on:
  pull_request:
    branches: [claude/upbeat-cannon-7ovk29]
  workflow_dispatch:

concurrency:
  group: bep52-phase4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint gettext libtool pkg-config \
            libcppunit-dev libssl-dev libxml2-dev libsqlite3-dev libc-ares-dev \
            libssh2-1-dev zlib1g-dev libgcrypt20-dev libgmp-dev
      - name: Bootstrap
        run: autoreconf -i
      - name: Configure
        run: ./configure
      - name: Build and test
        run: make -j2 check
      - name: Bundle runtime shared libraries
        run: |
          # Same rationale as the Windows job's DLL bundling: aria2c is
          # dynamically linked against libaria2 plus third-party libs
          # (OpenSSL, libxml2, sqlite3, c-ares, libssh2, gcrypt, gmp, ...)
          # that a target machine's distro may not have installed, or may
          # have at an incompatible version. Bundle every non-base-system
          # shared library ldd resolves next to the binary; the base
          # system ones (libc/libm/libpthread/ld-linux/linux-vdso/libdl/
          # librt) are assumed present on any glibc x86_64 Linux.
          mkdir -p dist
          cp src/aria2c dist/
          ldd src/aria2c | awk '{print $3}' | grep -v '^$' | \
            grep -vE '/(libc|libm|libpthread|libdl|librt|ld-linux-x86-64)\.so' | \
            sort -u | xargs -r -I{} cp -uL {} dist/
          chmod +x dist/aria2c
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: aria2-ultra-bep52-linux-x64
          path: upstream/dist
          if-no-files-found: error
          retention-days: 14

  macos-x64:
    runs-on: macos-13
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool pkg-config gettext \
            openssl@3 libxml2 sqlite c-ares libssh2 gmp libgcrypt
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - name: Bootstrap
        run: autoreconf -i
      - name: Configure
        run: |
          PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix libssh2)/lib/pkgconfig" \
            ./configure --disable-websocket
      - name: Build
        run: make -j3
      - name: Verify binary
        run: |
          test -s src/aria2c
          file src/aria2c
      - name: Bundle runtime dylibs
        run: |
          # Same rationale as the other two jobs: aria2c here is linked
          # against Homebrew-installed dylibs (OpenSSL, libxml2, sqlite3,
          # c-ares, libssh2, gmp, gcrypt, ...) that a plain macOS install
          # does not have. Recursively collect every non-/usr/lib,
          # non-/System dylib otool resolves, copy it next to the binary,
          # and rewrite load paths (both the binary's and each bundled
          # dylib's own dependencies) to @executable_path so the result
          # runs standalone without Homebrew installed.
          mkdir -p dist
          cp src/aria2c dist/
          bundle_deps() {
            local target="$1"
            otool -L "$target" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*|@*) continue ;;
              esac
              local base
              base="$(basename "$dep")"
              if [ ! -f "dist/$base" ]; then
                cp -L "$dep" "dist/$base"
                chmod +w "dist/$base"
                bundle_deps "dist/$base"
              fi
              install_name_tool -change "$dep" "@executable_path/$base" "$target"
            done
          }
          chmod +w dist/aria2c
          bundle_deps dist/aria2c
          install_name_tool -id "@executable_path/aria2c" dist/aria2c || true
          chmod +x dist/aria2c
          echo "--- final otool -L on binary and bundled dylibs ---"
          otool -L dist/aria2c
          for f in dist/*.dylib; do [ -f "$f" ] && otool -L "$f"; done
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: aria2-ultra-bep52-macos-x64
          path: upstream/dist
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    runs-on: windows-2022
    steps:
      # windows-2022 runners default to core.autocrlf=true, which rewrites
      # LF to CRLF on checkout. configure.ac (and other autotools sources)
      # use backslash line continuations that break under CRLF: an M4
      # macro argument list split across lines ends up with stray leading
      # whitespace on every continuation line once checked out as CRLF,
      # which is why AC_CHECK_HEADERS([windows.h \\\n  winsock2.h \\\n ...])
      # silently reports "no" for winsock2.h/ws2tcpip.h/etc even though
      # they exist - the macro-expanded header name has extra whitespace
      # in it. This must run before checkout so it applies to this clone.
      - name: Disable CRLF conversion for autotools sources
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make
            gettext-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-c-ares
            mingw-w64-x86_64-libssh2
            mingw-w64-x86_64-zlib
      - name: Bootstrap and configure
        shell: msys2 {0}
        working-directory: upstream
        run: |
          autoreconf -i
          ./configure --host=x86_64-w64-mingw32 --with-wintls --without-openssl --disable-websocket
      - name: Build
        shell: msys2 {0}
        working-directory: upstream
        run: make -j2
      - name: Verify binary
        shell: msys2 {0}
        working-directory: upstream
        run: |
          test -s src/aria2c.exe
          file src/aria2c.exe
      - name: Bundle runtime DLLs
        shell: msys2 {0}
        working-directory: upstream
        run: |
          # aria2c.exe is dynamically linked against libaria2 and the
          # MSYS2/mingw64 toolchain + third-party libs (gmp, libxml2,
          # sqlite3, c-ares, libssh2, zlib, libssl/libcrypto via wintls,
          # gcc/stdc++/winpthread runtime, ...). Uploading the .exe alone
          # produces a small (tens of KB) file that cannot run standalone
          # outside this CI environment: Windows just fails to launch it
          # (missing DLL) with no visible error in some launch contexts.
          # Collect every dependency ldd resolves under /mingw64 (i.e.
          # everything that isn't a base Windows system DLL) next to the
          # exe so the uploaded artifact is self-contained.
          mkdir -p dist
          cp src/aria2c.exe dist/
          ldd src/aria2c.exe | awk '{print $3}' | grep -i '^/mingw64/' | sort -u | \
            xargs -r -I{} cp -u {} dist/
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: aria2-ultra-bep52-windows-x64
          path: upstream/dist
          if-no-files-found: error
          retention-days: 14
