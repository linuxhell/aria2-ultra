name: BEP52 Linux CI

on:
  push:
    branches:
      - chatgpt/bep52-phase4-windows-x64
  workflow_dispatch:

concurrency:
  group: bep52-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake autotools-dev autopoint libtool pkg-config \
            libssl-dev libc-ares-dev zlib1g-dev libsqlite3-dev libssh2-1-dev \
            libcppunit-dev gettext
      - name: Restore upstream autotools macros
        run: |
          git clone --quiet https://github.com/aria2/aria2.git /tmp/aria2-reference
          git -C /tmp/aria2-reference checkout --quiet 9e7273583f83e881e3ec067b523ba88724088d2f
          cp -a /tmp/aria2-reference/m4 upstream/m4
      - name: Configure
        working-directory: upstream
        run: |
          autoreconf -i
          ./configure --with-openssl --without-gnutls
      - name: Build and test
        working-directory: upstream
        run: |
          if ! make -j2 check; then
            echo "===== test/test-suite.log ====="
            cat test/test-suite.log || true
            exit 1
          fi
