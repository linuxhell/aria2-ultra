name: Publish validated aria2-ultra binaries
on:
  push:
    branches: [chatgpt/bep52-phase4]
    paths: [.github/workflows/publish-aria2-ultra.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish validated aria2-ultra binaries'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aria2-ultra-bep52-linux-x64
          path: artifacts/linux
          repository: linuxhell/aria2-ultra
          run-id: 36612789452
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: aria2-ultra-bep52-windows-x64
          path: artifacts/windows
          repository: linuxhell/aria2-ultra
          run-id: 36612789452
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: aria2-ultra-bep52-macos-x64
          path: artifacts/macos
          repository: linuxhell/aria2-ultra
          run-id: 36612789452
          github-token: ${{ github.token }}
      - name: Verify and name release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp artifacts/linux/aria2c release-assets/aria2c-linux-x64
          cp artifacts/windows/aria2c.exe release-assets/aria2c-windows-x64.exe
          cp artifacts/macos/aria2c release-assets/aria2c-macos-x64
          echo '87769ff5628fb7a5369f5ce3d85496123819bb40948b47277304ddc3a3afc10e  release-assets/aria2c-linux-x64' | sha256sum -c -
          echo 'd8dc8dbbf5984b2d36fd23129028e38b3bde81e695cc7bd5bf68a16a683621d9  release-assets/aria2c-windows-x64.exe' | sha256sum -c -
          echo '3acb1dd18d59962d1340769d5c1156eb14c2f8e8982f4409b80e4619e0bbc60d  release-assets/aria2c-macos-x64' | sha256sum -c -
          for file in release-assets/aria2c-*; do
            (cd release-assets && sha256sum "${file##*/}" > "${file##*/}.sha256")
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.37.0-ultra.1 --repo linuxhell/aria2-ultra >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'
            exit 1
          fi
          gh release create v1.37.0-ultra.1 release-assets/* \
            --repo linuxhell/aria2-ultra \
            --target 59d5fec3fcc65e54c18d7f139990dc5ea7c57f26 \
            --title 'aria2-ultra 1.37.0 BEP52' \
            --notes 'BitTorrent v2/hybrid BEP52 support and optimized direct-download defaults. Standalone Windows x64, Linux x64, and macOS x64 binaries, validated by CI run 36612789452.'

  update_notes:
    if: github.event.head_commit.message == 'Update multilingual aria2-ultra release notes'
    runs-on: ubuntu-24.04
    steps:
      - name: Update release changelog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## English

          - Added BEP52 support for BitTorrent v2 and hybrid torrents alongside v1.
          - Tuned built-in defaults for direct downloads: 16 connections and splits, 1 MiB minimum split size, and truncating file allocation. BitTorrent keeps its appropriate automatic allocation behavior.
          - Published CI-validated standalone x64 binaries for Windows, Linux, and macOS, with SHA-256 checksum files.
          - Build source: commit 59d5fec3fcc65e54c18d7f139990dc5ea7c57f26; CI run 36612789452.

          ## Português (Brasil)

          - Adicionado suporte ao BEP52 para torrents BitTorrent v2 e híbridos, além de v1.
          - Ajustados os padrões internos para downloads diretos: 16 conexões e divisões, tamanho mínimo de divisão de 1 MiB e alocação de arquivo por truncamento. O BitTorrent mantém seu comportamento adequado de alocação automática.
          - Publicados binários independentes x64 para Windows, Linux e macOS, validados pelo CI, com arquivos de verificação SHA-256.
          - Código da compilação: commit 59d5fec3fcc65e54c18d7f139990dc5ea7c57f26; execução do CI 36612789452.

          ## 简体中文

          - 新增 BEP52 支持，兼容 BitTorrent v2 和混合种子，同时保留 v1 支持。
          - 优化直链下载的内置默认参数：16 个连接和分段、最小分段大小 1 MiB，以及截断式文件分配。BitTorrent 继续使用适当的自动分配行为。
          - 发布经过 CI 验证的 Windows、Linux 和 macOS 独立 x64 可执行文件，并附带 SHA-256 校验文件。
          - 构建源码：提交 59d5fec3fcc65e54c18d7f139990dc5ea7c57f26；CI 运行 36612789452。
          NOTES
          gh release edit v1.37.0-ultra.1 --repo linuxhell/aria2-ultra --notes-file release-notes.md
