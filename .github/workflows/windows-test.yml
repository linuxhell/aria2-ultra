name: Windows x64 test build

on:
  push:
    branches: [claude/upbeat-cannon-7ovk29]
    paths:
      - 'upstream/**'
      - '.github/workflows/windows-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: upstream
    env:
      ARIA2_BUILD_PROFILE: release
      CMAKE_BUILD_TYPE: Release
      STRIP_BINARY: 'true'
      TARGET_PROCESSOR: x86_64
      RUNTIME_PLATFORM: windows-x86_64
      ARIA2_RELEASE_LTO: OFF
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install LLVM-MinGW
        run: |
          . packaging/dependencies.env
          . packaging/scripts/common.sh
          curl_fetch "$LLVM_MINGW_URL" "$LLVM_MINGW_ARCHIVE" "$LLVM_MINGW_SHA256"
          tar xf "$LLVM_MINGW_ARCHIVE"
          echo "$PWD/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
      - name: Configure toolchain
        run: |
          prefix=x86_64-w64-mingw32
          {
            echo "CC=${prefix}-clang"
            echo "CXX=${prefix}-clang++"
            echo "RC=${prefix}-windres"
            echo "AR=${prefix}-ar"
            echo "RANLIB=${prefix}-ranlib"
            echo "STRIP=${prefix}-strip"
            echo "OBJDUMP=${prefix}-objdump"
          } >> "$GITHUB_ENV"
      - name: Verify tools
        run: packaging/scripts/verify-runner-tools windows-x86_64
      - name: Build
        run: packaging/scripts/build-release windows
      - name: Check binary and option
        run: |
          test -s build/release/aria2-next.exe
          file build/release/aria2-next.exe
          strings build/release/aria2-next.exe | grep -q 'tls-skip-revocation-check'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aria2-next-windows-x64-test
          path: upstream/build/release/aria2-next.exe
          if-no-files-found: error
          retention-days: 7
